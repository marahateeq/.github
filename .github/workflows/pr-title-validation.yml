name: Required - PR title follows KAN ticket pattern

on:
  workflow_call:
    inputs:
      ticket-prefix:
        description: 'Ticket prefix pattern (e.g., KAN, JIRA, TICKET, AU)'
        required: false
        type: string
        default: 'KAN'
    secrets:
      JIRA_BASE_URL:
        description: 'Jira instance URL (e.g., https://your-domain.atlassian.net)'
        required: false
      JIRA_EMAIL:
        description: 'Jira user email for authentication'
        required: false
      JIRA_API_TOKEN:
        description: 'Jira API token'
        required: false
  pull_request:
    branches:
      - main
      - master
      - dev
      - develop
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  validate-title:
    name: Validate PR title prefix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      ticket-numbers: ${{ steps.extract-tickets.outputs.tickets }}
    steps:
      - name: Check PR title starts with ticket number
        id: validate-format
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          TICKET_PREFIX: ${{ inputs.ticket-prefix || 'KAN' }}
        run: |
          echo "PR title: '$PR_TITLE'"
          echo "Expected format: '${TICKET_PREFIX}-<number>: <description>' (supports multiple tickets and various separators)"

          # Define the pattern for a single ticket: PREFIX-NUMBER (no leading zeros, no zero)
          ticket_pattern="${TICKET_PREFIX}-[1-9][0-9]*"

          # Pattern for multiple tickets with various separators: space, comma, slash, or combinations
          # Also supports brackets/parentheses around tickets
          # Valid: AU-1: , AU-1 AU-2: , AU-1,AU-2: , AU-3 / AU-4: , (AU-5) , [AU-6]
          if [[ "$PR_TITLE" =~ ^(\(|\[)?${TICKET_PREFIX}-[1-9][0-9]*(\)|\])?(([[:space:]]*[,/][[:space:]]*|\[)?${TICKET_PREFIX}-[1-9][0-9]*(\])?)*([[:space:]]*:?[[:space:]]*-?[[:space:]]+) ]]; then
            echo "✅ PR title is valid."
          else
            echo "::error title=Invalid PR title::Title must start with '${TICKET_PREFIX}-' followed by a non-zero number (no leading zeros)."
            echo ""
            echo "Examples of VALID titles:"
            echo "  ✅ '${TICKET_PREFIX}-1: Fix login'"
            echo "  ✅ '${TICKET_PREFIX}-1 ${TICKET_PREFIX}-2: Implement feature'"
            echo "  ✅ '${TICKET_PREFIX}-1,${TICKET_PREFIX}-2: Cleanup'"
            echo "  ✅ '${TICKET_PREFIX}-3 / ${TICKET_PREFIX}-4: Refactor'"
            echo "  ✅ '(${TICKET_PREFIX}-5) Improve tests'"
            echo "  ✅ '[${TICKET_PREFIX}-6] Add documentation'"
            echo ""
            echo "Examples of INVALID titles:"
            echo "  ❌ '${TICKET_PREFIX,,}-1' (lowercase prefix)"
            echo "  ❌ '${TICKET_PREFIX}-0' (zero ticket number)"
            echo "  ❌ '${TICKET_PREFIX}-00' (zero with leading zero)"
            echo "  ❌ '${TICKET_PREFIX}-01' (leading zero)"
            echo "  ❌ '${TICKET_PREFIX}-8Update' (no separator after number)"
            exit 1
          fi

      - name: Extract ticket numbers
        id: extract-tickets
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          TICKET_PREFIX: ${{ inputs.ticket-prefix || 'KAN' }}
        run: |
          # Extract all ticket numbers from the PR title
          tickets=$(echo "$PR_TITLE" | grep -oE "${TICKET_PREFIX}-[1-9][0-9]*" | sort -u | tr '\n' ' ')
          echo "Extracted tickets: $tickets"
          echo "tickets=$tickets" >> $GITHUB_OUTPUT

  validate-jira-status:
    name: Validate Jira ticket status
    needs: validate-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check Jira ticket status and add PR comment
        shell: bash
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKETS: ${{ needs.validate-title.outputs.ticket-numbers }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Skip if no Jira configuration provided
          if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "ℹ️  Jira integration not configured. Skipping ticket validation."
            exit 0
          fi

          # Debug: Show configuration (without exposing secrets)
          echo "🔧 Jira Configuration:"
          echo "  Base URL: ${JIRA_BASE_URL}"
          echo "  Email: ${JIRA_EMAIL}"
          echo "  API Token: [REDACTED]"

          # Validate URL format
          if [[ ! "$JIRA_BASE_URL" =~ ^https?:// ]]; then
            echo "::error title=Invalid Jira URL::JIRA_BASE_URL must start with http:// or https://"
            exit 1
          fi

          # Create base64 encoded credentials for Basic Auth
          AUTH=$(echo -n "${JIRA_EMAIL}:${JIRA_API_TOKEN}" | base64)

          echo ""
          echo "🔍 Checking Jira tickets: $TICKETS"

          all_valid=true
          invalid_tickets=""

          for ticket in $TICKETS; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Checking ticket: $ticket"

            # Build the full URL
            full_url="${JIRA_BASE_URL}/rest/api/3/issue/${ticket}?fields=status,summary"
            echo "Full URL: $full_url"
            echo "URL Length: ${#full_url}"

            # Test URL validity
            if [[ ! "$full_url" =~ ^https?://[a-zA-Z0-9.-]+\. ]]; then
              echo "::error title=Invalid URL::The constructed URL appears malformed"
              echo "  ❌ URL validation failed - check JIRA_BASE_URL format"
              all_valid=false
              invalid_tickets="$invalid_tickets\n  ❌ $ticket - Invalid URL"
              continue
            fi

            # Get ticket status from Jira with verbose error handling
            # Use separate stderr capture
            error_output=$(mktemp)
            response=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Basic $AUTH" \
              -H "Content-Type: application/json" \
              "$full_url" 2>"$error_output")

            curl_exit_code=$?
            curl_stderr=$(cat "$error_output")
            rm -f "$error_output"

            # Check if curl command itself failed
            if [ $curl_exit_code -ne 0 ]; then
              echo "::error title=Curl Error::Failed to connect to Jira (exit code: $curl_exit_code)"
              echo "  ❌ Curl exit code: $curl_exit_code"
              echo "  📝 Error message: $curl_stderr"
              echo "  📋 Response: $response"

              # Explain common curl exit codes
              case $curl_exit_code in
                6) echo "  💡 Could not resolve host - DNS issue or wrong domain" ;;
                7) echo "  💡 Failed to connect - Network/firewall issue or wrong URL" ;;
                28) echo "  💡 Timeout - Server not responding" ;;
                35) echo "  💡 SSL connection error" ;;
                43) echo "  💡 Internal error or malformed URL" ;;
                60) echo "  💡 SSL certificate problem" ;;
              esac

              all_valid=false
              invalid_tickets="$invalid_tickets\n  ❌ $ticket - Connection failed (curl error $curl_exit_code)"
              continue
            fi

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            echo "  HTTP Status: $http_code"

            if [ "$http_code" -ne 200 ]; then
              echo "::error title=Jira API Error::Ticket $ticket request failed (HTTP $http_code)"
              echo "  Response body: $body"

              if [ "$http_code" -eq 401 ]; then
                echo "  ❌ Authentication failed - Check JIRA_EMAIL and JIRA_API_TOKEN"
              elif [ "$http_code" -eq 404 ]; then
                echo "  ❌ Ticket not found - Does $ticket exist in your Jira?"
              elif [ "$http_code" -eq 403 ]; then
                echo "  ❌ Permission denied - Your API token may not have access to this ticket"
              fi

              all_valid=false
              invalid_tickets="$invalid_tickets\n  ❌ $ticket - HTTP $http_code error"
              continue
            fi

            # Parse status from JSON response
            status=$(echo "$body" | grep -o '"status":{[^}]*"name":"[^"]*"' | grep -o '"name":"[^"]*"' | cut -d'"' -f4)
            summary=$(echo "$body" | grep -o '"summary":"[^"]*"' | head -1 | cut -d'"' -f4)

            # Check if parsing was successful
            if [ -z "$status" ]; then
              echo "::error title=Parse Error::Failed to extract status from Jira response"
              echo "  ❌ Could not parse status from JSON response"
              echo "  Raw response: $body"
              all_valid=false
              invalid_tickets="$invalid_tickets\n  ❌ $ticket - Failed to parse status"
              continue
            fi

            echo "  📋 Summary: $summary"
            echo "  📊 Current Status: '$status'"

            # Normalize status for comparison (trim whitespace, convert to lowercase)
            normalized_status=$(echo "${status}" | xargs | tr '[:upper:]' '[:lower:]')
            echo "  🔍 Normalized status: '$normalized_status' (checking if equals 'in progress')"

            # Check if status is "In Progress" (ONLY this status is allowed)
            if [[ "$normalized_status" == "In Progress" ]]; then
              echo "  ✅ Status is VALID - Ticket is 'In Progress'"

              # Add PR comment to Jira issue
              comment_body=$(cat <<EOF
          {
            "body": {
              "type": "doc",
              "version": 1,
              "content": [
                {
                  "type": "paragraph",
                  "content": [
                    {
                      "type": "text",
                      "text": "Pull Request #${PR_NUMBER} created: "
                    },
                    {
                      "type": "text",
                      "text": "${PR_TITLE}",
                      "marks": [{"type": "strong"}]
                    }
                  ]
                },
                {
                  "type": "paragraph",
                  "content": [
                    {
                      "type": "text",
                      "text": "🔗 "
                    },
                    {
                      "type": "text",
                      "text": "${PR_URL}",
                      "marks": [
                        {
                          "type": "link",
                          "attrs": {
                            "href": "${PR_URL}"
                          }
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          }
          EOF
              )

              comment_response=$(curl -s -w "\n%{http_code}" \
                -X POST \
                -H "Authorization: Basic $AUTH" \
                -H "Content-Type: application/json" \
                -d "$comment_body" \
                "${JIRA_BASE_URL}/rest/api/3/issue/${ticket}/comment")

              comment_http_code=$(echo "$comment_response" | tail -n1)

              if [ "$comment_http_code" -eq 201 ]; then
                echo "  ✅ PR comment added to Jira ticket"
              else
                echo "  ⚠️  Failed to add comment to Jira (HTTP $comment_http_code)"
              fi

            else
              echo "  ❌ Status is INVALID - Ticket must be 'In Progress'"
              echo "::error title=Invalid Jira status::Ticket $ticket has status '$status' but MUST be 'In Progress' before creating a PR"
              all_valid=false
              invalid_tickets="$invalid_tickets\n  ❌ $ticket - Status is '$status' (MUST be 'In Progress')"
            fi
          done

          echo ""
          if [ "$all_valid" = false ]; then
            echo "::error title=Jira validation failed::One or more tickets have invalid status"
            echo ""
            echo "❌ Validation FAILED for the following tickets:"
            echo -e "$invalid_tickets"
            echo ""
            echo "📋 REQUIREMENT: All tickets MUST have status 'In Progress' before the PR can be merged."
            echo ""
            echo "💡 Action Required: Move ticket(s) to 'In Progress' status in Jira, then re-run this check."
            exit 1
          else
            echo "✅ SUCCESS: All Jira tickets are in 'In Progress' status"
            echo "📝 PR comments have been posted to the Jira ticket(s)"
          fi
