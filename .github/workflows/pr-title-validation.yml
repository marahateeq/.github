name: Required - PR title follows KAN ticket pattern

on:
  workflow_call:
    inputs:
      ticket-prefix:
        description: 'Ticket prefix pattern (e.g., KAN, JIRA, TICKET)'
        required: false
        type: string
        default: 'KAN'
  pull_request:
    branches:
      - 'KAN-*'  # Matches feature branches like KAN-5-connect-GitHub-repo-to-Jira
      - main
      - master
      - dev
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  validate-title:
    name: Validate PR title prefix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check PR title starts with ticket number
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          TICKET_PREFIX: ${{ inputs.ticket-prefix || 'KAN' }}
        run: |
          echo "PR title: '$PR_TITLE'"
          echo "Expected format: '${TICKET_PREFIX}-<number>: <description>' or '[${TICKET_PREFIX}-<number>] <description>'"
          if [[ "$PR_TITLE" =~ ^(\[${TICKET_PREFIX}-[1-9][0-9]*\]\ |${TICKET_PREFIX}-[1-9][0-9]*[:\s-]) ]]; then
            echo "✅ PR title is valid."
          else
            echo "::error title=Invalid PR title::Title must start with '${TICKET_PREFIX}-' followed by a non-zero number and a separator (colon, space, or dash)."
            echo "Examples of INVALID titles:"
            echo "  ❌ '${TICKET_PREFIX}-0: Fix' (zero ticket number)"
            echo "  ❌ '${TICKET_PREFIX}-8Update' (no separator after number)"
            echo "  ❌ '${TICKET_PREFIX,,}-5: Fix' (lowercase prefix)"
            echo ""
            echo "Examples of VALID titles:"
            echo "  ✅ '${TICKET_PREFIX}-4: Fix login bug'"
            echo "  ✅ '${TICKET_PREFIX}-5 Update feature'"
            echo "  ✅ '${TICKET_PREFIX}-8-Clean up blank lines'"
            echo "  ✅ '${TICKET_PREFIX}-123 - Add documentation'"
            echo "  ✅ '[${TICKET_PREFIX}-8] Clean up blank lines'"
            echo "  ✅ '[${TICKET_PREFIX}-8] -Clean up blank lines'"
            exit 1
          fi
